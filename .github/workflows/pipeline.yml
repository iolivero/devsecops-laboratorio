name: DevSecOps Pipeline - Snyk

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1️⃣ SAST
  sast_snyk_code:
    name: SAST - Snyk Code 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (clonar repositorio)
        uses: actions/checkout@v4

      - name: Setup Node (para Next.js/TS)
        uses: actions/setup-node@v4
        with:
          node-version: '19'
          cache: 'npm'

      - name: Install deps
        run: npm ci || true

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@v1

      - name: Run Snyk Code (SAST) - falla cuando encuentra Medium+
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=medium

  # 2️⃣ SCA 
  sca_snyk:
    name: 3) SCA - Snyk Open Source 
    runs-on: ubuntu-latest
    needs: [sast_snyk_code]
    if: ${{ always() }}   
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '19'
          cache: 'npm'

      - name: Install deps
        run: npm ci || true

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@v1

      - name: Run Snyk Open Source (SCA)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=medium --all-projects

  # 3️⃣ Image Security 
  image_security_snyk:
    name: Image Security - Snyk Container 
    runs-on: ubuntu-latest
    needs: [sca_snyk]
    if: ${{ always() }}   
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: app:${{ github.sha }}

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@v1

      - name: Snyk Container test - fail on Medium+
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test app:${{ github.sha }} \
            --file=Dockerfile \
            --severity-threshold=medium
