name: DevSecOps Lab - Snyk only

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '19'
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # (1) Clonación explícita del repo
  clone_repository:
    name: 1) Clonar repositorio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

  # (2) SAST - Snyk Code (fallar si Medium+)
  sast_snyk_code:
    name:  SAST - Snyk Code (fail on Medium+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (clonar repositorio)
        uses: actions/checkout@v4

      - name: Setup Node (opcional para Next.js/TS)
        uses: actions/setup-node@v4
        with:
          node-version: '19'
          cache: 'npm'

      - name: Install deps (si aplica)
        run: npm ci || true

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@v1

      # Ejecuta Snyk Code y genera SARIF.
      # Si hay hallazgos >= medium el comando devuelve exit != 0; no bloqueamos aún para poder subir el SARIF.
      - name: Run Snyk Code (SAST) -> SARIF
        run: |
          snyk code test --severity-threshold=medium --sarif-file-output=snyk-code.sarif || echo "Snyk Code exit != 0 (findings >= medium)"
          # Si por cualquier motivo el archivo no existe, crea uno vacío para no romper el upload
          if [ ! -f snyk-code.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > snyk-code.sarif
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload SARIF (Snyk Code)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      # Corta el pipeline si hay hallazgos (>= medium)
      - name: Fail if SAST findings (>= medium)
        run: |
          count=$(jq '[.runs[].results[]] | length' snyk-code.sarif 2>/dev/null || echo 0)
          echo "SAST findings: ${count}"
          if [ "${count}" -gt 0 ]; then
            echo "❌ SAST FAIL: issues with severity >= medium found"
            exit 1
          fi 