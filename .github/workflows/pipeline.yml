name: DevSecOps Lab - Snyk only

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '19'
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # (1) Clonación explícita del repo
  clone_repository:
    name: 1) Clonar repositorio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

  # (2) SAST - Snyk Code (fallar si Medium+)
  sast_snyk_code:
    name: 2) SAST - Snyk Code 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (clonar repositorio)
        uses: actions/checkout@v4

      - name: Setup Node (opcional para Next.js/TS)
        uses: actions/setup-node@v4
        with:
          node-version: '19'
          cache: 'npm'

      - name: Install deps (si aplica)
        run: npm ci || true

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@v1

      # Ejecutamos Snyk Code. No fallamos aquí para poder procesar y subir el SARIF condicionalmente.
      - name: Run Snyk Code (SAST) -> SARIF
        id: snykcode
        run: |
          set -o pipefail
          # Ejecuta Snyk Code y genera SARIF; si hay Critical saldrá con exit!=0, pero no paramos aún
          snyk code test --severity-threshold=medium --sarif-file-output=snyk-code.sarif || true

          # Determina si el SARIF existe y tiene 'runs'
          if [ -f snyk-code.sarif ]; then
            has_runs=$(jq 'has("runs") and (.runs | length > 0)' snyk-code.sarif 2>/dev/null || echo false)
          else
            has_runs=false
          fi
          echo "has_runs=${has_runs}" >> "$GITHUB_OUTPUT"

          # Cuenta findings (resultados) si hay runs; si no hay, cuenta=0
          if [ "${has_runs}" = "true" ]; then
            count=$(jq '[.runs[].results[]] | length' snyk-code.sarif 2>/dev/null || echo 0)
          else
            count=0
          fi
          echo "count=${count}" >> "$GITHUB_OUTPUT"

          echo "SAST SARIF has_runs=${has_runs} findings=${count}"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Subimos SARIF solo si Snyk generó al menos un 'run' (SARIF válido para Code Scanning)
      - name: Upload SARIF (Snyk Code)
        if: steps.snykcode.outputs.has_runs == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      # Fallamos el job si hay hallazgos (>= critical)
      - name: Fail if SAST findings (>= critical)
        run: |
          count='${{ steps.snykcode.outputs.count }}'
          echo "SAST findings: ${count}"
          if [ "${count}" -gt 0 ]; then
            echo "❌ SAST FAIL: issues with severity >= medium found"
            exit 1
          fi 