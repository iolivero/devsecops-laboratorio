name: DevSecOps Lab - Snyk only

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '19'
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # (1) Clonación explícita del repo
  clone_repository:
    name: 1) Clonar repositorio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

  # (2) SAST - Snyk Code (fallar si Medium+)
  sast_snyk_code:
    name: 2) SAST - Snyk Code 
    runs-on: ubuntu-latest
    needs: [clone_repository]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps (si aplica)
        run: |
          npm ci || true

      - name: Setup Snyk
        uses: snyk/actions/setup@v4

      # Importante: usamos || true para permitir subir SARIF y luego fallamos nosotros
      - name: Run Snyk Code (SAST) -> SARIF
        run: snyk code test --severity-threshold=critical --sarif-file-output=snyk-code.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload SARIF (Snyk Code)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif

      - name: Fail if SAST findings (>= medium)
        run: |
          count=$(jq '[.runs[].results[]] | length' snyk-code.sarif 2>/dev/null || echo 0)
          echo "SAST findings: ${count}"
          if [ "${count}" -gt 0 ]; then
            echo "❌ SAST FAIL: issues with severity >= crtitical found"
            exit 1
          fi